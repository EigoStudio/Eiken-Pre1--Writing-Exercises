<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eiken Pre-1 Writing: Technology-free Life (Affirmative)</title>
<style>
    :root {
        --primary-blue: #1a237e; 
        --soft-blue: #e8eaf6;
        --silver-gray: #f5f5f7;
        --border-gray: #cfd8dc;
        --accent-teal: #00897b;
        --correct-green: #2e7d32;
        --wrong-red: #c62828;
        --text-dark: #1a1a1a;
        --base-font: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "Yu Gothic", "Meiryo", sans-serif;
    }

    body {
        font-family: var(--base-font);
        background-color: var(--silver-gray);
        color: var(--text-dark);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        margin: 0;
    }

    header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 900px; }
    h1 { font-size: 1.5rem; margin-bottom: 5px; color: var(--primary-blue); }
    .sub-title { font-size: 0.85rem; color: #555; margin-bottom: 15px; font-weight: normal; }

    .control-panel {
        display: flex; align-items: center; justify-content: center; gap: 20px;
        background: rgba(255,255,255,0.8); padding: 8px 20px; border-radius: 50px; border: 1px solid var(--border-gray);
    }

    .settings { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: bold; }
    .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary-blue); }
    input:checked + .slider:before { transform: translateX(16px); }

    .tabs { display: flex; gap: 8px; }
    .tab-btn {
        padding: 6px 15px; border-radius: 20px; border: 2px solid var(--primary-blue);
        background: white; color: var(--primary-blue); cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.3s;
    }
    .tab-btn.active { background: var(--primary-blue); color: white; }

    .container {
        background: white; max-width: 900px; width: 100%; padding: 30px; border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;
    }

    .question-box {
        font-size: 1rem; background-color: var(--soft-blue); border-bottom: 4px solid var(--primary-blue);
        padding: 20px; border-radius: 15px; margin-bottom: 10px; font-weight: bold; min-height: 40px; display: flex; align-items: center; justify-content: center;
    }

    .grammar-hint {
        font-size: 0.8rem; color: var(--accent-teal); margin-bottom: 15px; font-weight: bold;
        background: #e0f2f1; padding: 5px 15px; border-radius: 10px; display: inline-block;
    }

    .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 700px; margin: 0 auto; }
    
    .choice-btn, .word-btn {
        background-color: var(--soft-blue); color: #000; border: 1px solid var(--border-gray);
        padding: 12px 15px; border-radius: 15px; cursor: pointer; font-size: 0.9rem; font-family: var(--base-font); font-weight: bold; transition: all 0.2s;
    }
    .choice-btn:hover { background-color: #c5cae9; }
    
    .word-bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 15px; }
    .word-btn.used { visibility: hidden; pointer-events: none; }

    .answer-area {
        min-height: 80px; border: 2px dashed var(--border-gray); border-radius: 15px; padding: 15px;
        margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #fafafa;
    }

    .answer-word {
        background-color: white; color: #000; border: 1.5px solid var(--primary-blue);
        padding: 8px 15px; border-radius: 10px; cursor: grab; font-size: 0.9rem; font-weight: bold;
        user-select: none;
    }
    .answer-word:active { cursor: grabbing; }
    .answer-word.dragging { opacity: 0.5; }

    .final-sentence {
        font-size: 1.2rem; color: var(--primary-blue); font-weight: bold; padding: 20px;
        line-height: 1.6; text-align: left; background: #f5f5f7; border-radius: 15px;
    }

    .action-btn {
        background: var(--primary-blue); color: white; border: none; padding: 15px 40px;
        border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .action-btn:disabled { background: #ccc; }

    /* 印刷用エリアの設定 */
    #print-area { display: none; }

    @media print {
        .container, header, .no-print, .action-btn { display: none !important; }
        #print-area { 
            display: block !important; 
            color: black; 
            background: white; 
            width: 100%; 
            font-family: var(--base-font); 
        }
        .print-page { page-break-after: always; padding: 5px 10px; }
        .print-title { font-size: 1.1rem; text-align: center; border-bottom: 1px solid #000; margin-bottom: 10px; padding-bottom: 5px; font-weight: bold; }
        .print-vocab-q { margin-bottom: 8px; font-size: 0.9rem; display: flex; align-items: flex-end; }
        .vocab-jp { width: 45%; }
        .vocab-line { flex-grow: 1; border-bottom: 1px solid #000; height: 40px; }
        .print-sentence-q { margin-bottom: 8px; }
        .sentence-ja { font-size: 0.8rem; font-weight: bold; margin-bottom: 1.5px; }
        .sentence-hint { font-size: 0.70rem; color: #444; margin-bottom: 1.5px; font-style: italic; }
        .sentence-choices { font-style: italic; font-size: 0.75rem; color: #333; }
        .sentence-line { border-bottom: 1px solid #000; height: 25px; margin-top: 4px; }
    }
</style>
</head>
<body>

<header class="no-print">
    <h1>Eiken Pre-1 Writing Prep - Part 1</h1>
    <div class="sub-title">Topic: The society should promote a technology-free life (Affirmative)</div>
    
    <div class="control-panel">
        <div class="settings">
            <span>Audio</span>
            <label class="switch">
                <input type="checkbox" id="audioToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="tab-vocab" onclick="switchMode('vocab')">Vocabulary</button>
            <button class="tab-btn" id="tab-reorder" onclick="switchMode('reorder')">Sentences</button>
        </div>
    </div>
</header>

<div class="container no-print">
    <div id="quiz-ui">
        <div class="question-box" id="questionText">Loading...</div>
        <div id="hint-box" class="grammar-hint" style="display:none;"></div>
        <div id="interactive-area"></div>
        <div id="resultMsg" style="margin: 15px 0; font-size: 1.1rem; font-weight: bold;"></div>
        <button class="action-btn" id="mainActionBtn" onclick="handleMainAction()" disabled>Check Answer</button>
    </div>
    <button onclick="window.print()" style="margin-top:20px; background:none; border:none; text-decoration:underline; cursor:pointer; color:#777; font-size: 0.7rem;">ワークシートを印刷する（A4）</button>
</div>

<div id="print-area">
    <div class="print-page">
        <div class="print-title">Pre-1 Writing: Technology-free Life (Vocab)</div>
        <div id="print-vocab-content"></div>
    </div>
    <div class="print-page">
        <div class="print-title">Pre-1 Writing: Technology-free Life (Structures)</div>
        <div id="print-sentence-content"></div>
    </div>
</div>

<script>
const vocabDataRaw = [
    { en: "detrimental effects", jp: "有害な影響" },
    { en: "excessive screen time", jp: "過剰なスクリーンタイム" },
    { en: "alleviate mental stress", jp: "精神的ストレスを軽減する" },
    { en: "sedentary lifestyle", jp: "座りっぱなしの生活様式" },
    { en: "improve sleep quality", jp: "睡眠の質を改善する" },
    { en: "constant notifications", jp: "絶え間ない通知" },
    { en: "digital detox", jp: "デジタルデトックス" },
    { en: "face-to-face communication", jp: "対面でのコミュニケーション" },
    { en: "blue light exposure", jp: "ブルーライトへの曝露" },
    { en: "mental well-being", jp: "精神的な健康（幸福）" },
    { en: "escape from pressure", jp: "プレッシャーからの解放" },
    { en: "reconnect with nature", jp: "自然と再びつながる" },
    { en: "cognitive function", jp: "認知機能" },
    { en: "social media addiction", jp: "SNS依存症" },
    { en: "physical activity", jp: "身体活動（運動）" },
    { en: "reduce eye strain", jp: "目の疲れを軽減する" },
    { en: "be bombarded with information", jp: "情報攻めに遭う" },
    { en: "inner peace", jp: "心の平穏" }
];

const sentenceData = [
    { ja: "過度なデバイスの使用は、私たちの身体的健康に有害な影響を及ぼします。", en: "Excessive use of devices has detrimental effects on our physical health.", hint: "主語 + 述語 + 目的語" },
    { ja: "テクノロジーから離れる時間を持つことは、現代社会において不可欠です。", en: "Taking time away from technology is essential in modern society.", hint: "動名詞句 (~ing) を主語にする" },
    { ja: "スクリーンタイムを減らすことで、人々は睡眠の質を大幅に改善できます。", en: "By reducing screen time, people can significantly improve their sleep quality.", hint: "By ~ing (〜することで)" },
    { ja: "常に通知に追いかけられることは、多大な精神的ストレスを引き起こします。", en: "Being constantly chased by notifications causes significant mental stress.", hint: "受動態の動名詞句を主語にする" },
    { ja: "デジタルデトックスを実践することは、人々が心の平穏を取り戻すのに役立ちます。", en: "Practicing digital detox helps people regain their inner peace.", hint: "help + 人 + 動詞の原形" },
    { ja: "多くの人々が、仕事のメールに即座に返信しなければならないというプレッシャーを感じています。", en: "Many people feel pressure to respond to work emails immediately.", hint: "不定詞の形容詞的用法 (pressure to ~)" },
    { ja: "デジタルデバイスのない生活を促進することは、対面での会話を増やします。", en: "Promoting a technology-free life increases face-to-face communication.", hint: "動名詞主語 (~ing)" },
    { ja: "情報から切り離されることで、私たちは本当に重要なことに集中できます。", en: "Being disconnected from information allows us to focus on what is truly important.", hint: "allow + 人 + to do / 関係代名詞 what" },
    { ja: "絶え間ない情報の流れを避けることが、精神的な健康を維持するために必要です。", en: "It is necessary to avoid the constant flow of information to maintain mental well-being.", hint: "形式主語 It is ... to ~ / to不定詞が2回" },
    { ja: "自然の中で時間を過ごすことは、テクノロジーによる疲労を回復させる素晴らしい方法です。", en: "Spending time in nature is a great way to recover from technology-induced fatigue.", hint: "動名詞主語 / 形容詞的用法の不定詞" }
];

let currentMode = 'vocab';
let currentIdx = 0;
let userSentence = [];
let isChecked = false;
let tries = 3;
let selectedWord = "";
let vocabData = [];

function speak(text) {
    if (!document.getElementById('audioToggle').checked) return;
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = "en-US";
    uttr.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(uttr);
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function switchMode(mode) {
    currentMode = mode;
    currentIdx = 0;
    if(mode === 'vocab') {
        vocabData = [...vocabDataRaw];
        shuffleArray(vocabData);
    }
    document.getElementById('tab-vocab').classList.toggle('active', mode === 'vocab');
    document.getElementById('tab-reorder').classList.toggle('active', mode === 'reorder');
    loadQuestion();
}

function loadQuestion() {
    isChecked = false;
    tries = 3;
    document.getElementById('resultMsg').textContent = "";
    const btn = document.getElementById('mainActionBtn');
    btn.textContent = "Check Answer";
    btn.disabled = true;

    const area = document.getElementById('interactive-area');
    const hintBox = document.getElementById('hint-box');
    area.innerHTML = "";

    if (currentMode === 'vocab') {
        hintBox.style.display = "none";
        const item = vocabData[currentIdx];
        document.getElementById('questionText').textContent = item.jp;
        let choices = [item.en];
        while(choices.length < 4) {
            let r = vocabDataRaw[Math.floor(Math.random()*vocabDataRaw.length)].en;
            if(!choices.includes(r)) choices.push(r);
        }
        shuffleArray(choices);
        
        const grid = document.createElement('div');
        grid.className = "choices-grid";
        choices.forEach(c => {
            const b = document.createElement('button');
            b.className = "choice-btn";
            b.textContent = c;
            b.onclick = () => {
                if(isChecked) return;
                selectedWord = c;
                document.querySelectorAll('.choice-btn').forEach(btn => btn.style.backgroundColor = "var(--soft-blue)");
                b.style.backgroundColor = "#c5cae9";
                btn.disabled = false;
                speak(c);
            };
            grid.appendChild(b);
        });
        area.appendChild(grid);
    } else {
        const item = sentenceData[currentIdx];
        document.getElementById('questionText').textContent = item.ja;
        hintBox.textContent = `Hint: ${item.hint}`;
        hintBox.style.display = "inline-block";
        userSentence = [];
        
        const ansArea = document.createElement('div');
        ansArea.className = "answer-area";
        ansArea.id = "answerArea";
        ansArea.addEventListener('dragover', e => {
            e.preventDefault();
            const draggingElement = document.querySelector('.dragging');
            const afterElement = getDragAfterElement(ansArea, e.clientX);
            if (afterElement == null) {
                ansArea.appendChild(draggingElement);
            } else {
                ansArea.insertBefore(draggingElement, afterElement);
            }
        });

        area.appendChild(ansArea);

        const bank = document.createElement('div');
        bank.className = "word-bank";
        
        let words = item.en.replace(/([.,])/g, " $1").split(" ").filter(w => w !== "");
        let shuffleWords = [...words];
        shuffleArray(shuffleWords);

        shuffleWords.forEach((w, idx) => {
            const b = document.createElement('button');
            b.className = "word-btn";
            b.textContent = w;
            b.id = "word-" + idx;
            b.onclick = () => {
                userSentence.push({text: w, btnId: b.id});
                b.classList.add('used');
                renderSentence();
                btn.disabled = false;
            };
            bank.appendChild(b);
        });
        area.appendChild(bank);
    }
}

function getDragAfterElement(container, x) {
    const draggableElements = [...container.querySelectorAll('.answer-word:not(.dragging)')];
    return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = x - box.left - box.width / 2;
        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function renderSentence() {
    const area = document.getElementById('answerArea');
    area.innerHTML = "";
    userSentence.forEach((obj, i) => {
        const s = document.createElement('div');
        s.className = "answer-word";
        s.textContent = obj.text;
        s.draggable = true;
        s.addEventListener('dragstart', () => s.classList.add('dragging'));
        s.addEventListener('dragend', () => {
            s.classList.remove('dragging');
            const currentDOMWords = [...document.querySelectorAll('.answer-word')];
            userSentence = currentDOMWords.map(el => userSentence.find(u => u.text === el.textContent));
        });
        s.onclick = () => {
            document.getElementById(obj.btnId).classList.remove('used');
            userSentence = userSentence.filter(item => item !== obj);
            renderSentence();
        };
        area.appendChild(s);
    });
}

function handleMainAction() {
    const btn = document.getElementById('mainActionBtn');
    const resultMsg = document.getElementById('resultMsg');

    if (!isChecked) {
        let correctText = currentMode === 'vocab' ? vocabData[currentIdx].en : sentenceData[currentIdx].en;
        let isCorrect = false;

        if (currentMode === 'vocab') {
            isCorrect = (selectedWord === correctText);
        } else {
            const currentDOMWords = [...document.querySelectorAll('.answer-word')].map(el => el.textContent);
            let userStr = currentDOMWords.join(" ").replace(/\s+([.,])/g, "$1");
            isCorrect = (userStr === correctText);
        }

        if (isCorrect) {
            isChecked = true;
            speak(correctText);
            document.getElementById('interactive-area').innerHTML = `<div class="final-sentence">${correctText}</div>`;
            
            if (currentMode === 'vocab') {
                const vocabEncourages = [
                    "Perfect! Keep using these words to boost your score! 💪",
                    "Nice! This expression will definitely impress the examiner! 🚀"
                ];
                resultMsg.innerHTML = vocabEncourages[Math.floor(Math.random() * vocabEncourages.length)];
            } else {
                const sentenceEncourages = [
                    "Great job! That's a powerful structure for your essay! ✍️",
                    "Excellent! Try using this grammar in your next Pre-1 writing! ✨"
                ];
                resultMsg.innerHTML = sentenceEncourages[Math.floor(Math.random() * sentenceEncourages.length)];
            }
            btn.textContent = "Next →";
        } else {
            tries--;
            if (tries > 0) {
                resultMsg.innerHTML = `Not quite! Let's try again. (${tries} left)`;
                resultMsg.style.color = "var(--wrong-red)";
            } else {
                isChecked = true;
                resultMsg.innerHTML = `Answer: ${correctText}`;
                btn.textContent = "Next →";
            }
        }
    } else {
        currentIdx++;
        const max = currentMode === 'vocab' ? vocabData.length : sentenceData.length;
        if (currentIdx < max) loadQuestion();
        else {
            const finishedItem = currentMode === 'vocab' ? 'key phrases' : 'advanced structures';
            document.getElementById('quiz-ui').innerHTML = `<h2>Mission Accomplished!</h2><p>You've mastered the ${finishedItem} for 'Technology-free Life'. Good luck with your Pre-1 exam!</p>`;
            btn.style.display = "none";
        }
    }
}

function preparePrint() {
    document.getElementById('print-vocab-content').innerHTML = vocabDataRaw.map((d, i) => `
        <div class="print-vocab-q">
            <span class="vocab-jp">${i+1}. ${d.jp}</span>
            <div class="vocab-line"></div>
        </div>`).join('');

    document.getElementById('print-sentence-content').innerHTML = sentenceData.map((d, i) => {
        let words = d.en.replace(/([.,])/g, " $1").split(" ").filter(w => w !== "");
        shuffleArray(words);
        return `
            <div class="print-sentence-q">
                <div class="sentence-ja">${i+1}. ${d.ja}</div>
                <div class="sentence-hint">Hint: ${d.hint}</div>
                <div class="sentence-choices">[ ${words.join(" / ")} ]</div>
                <div class="sentence-line"></div>
            </div>`;}).join('');
}

window.onload = () => {
    vocabData = [...vocabDataRaw];
    shuffleArray(vocabData);
    loadQuestion();
    preparePrint();
};
</script>
</body>
</html>
